services:
  db:
    image: postgres:16
    container_name: ums-db
    environment:
      POSTGRES_DB: umsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ums-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/umsdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"

volumes:
  pgdata: